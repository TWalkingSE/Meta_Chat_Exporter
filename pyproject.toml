[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-chat-exporter"
version = "5.4"
description = "Exporta conversas (Unified Messages) de registros da Meta para HTML, JSON e CSV, com consolidação, estatísticas e transcrição opcional."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Chat Exporter" }]
keywords = ["meta", "messenger", "whatsapp", "chat", "export", "html", "json", "csv"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]
dependencies = [
    "PyQt6>=6.6.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
langdetect = ["langdetect>=1.0.9"]
transcription = ["openai-whisper"]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "hypothesis>=6.100.0",
    "pyinstaller>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/"
Repository = "https://github.com/"

[project.scripts]
chat-exporter = "meta_chat_exporter.cli:main"

[project.gui-scripts]
chat-exporter-gui = "meta_chat_exporter.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ============================================================================
# Ruff — linter + formatter
# ============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["venv", ".venv", "_reversa_sdd", ".reversa", ".agents"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # function call in default argument (common in PyQt/argparse patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ============================================================================
# Mypy — type checking (gradual)
# ============================================================================
[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = "(venv|\\.venv|_reversa_sdd|\\.reversa|\\.agents)/"

# ============================================================================
# Pytest
# ============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_files = ["test_*.py"]

# ============================================================================
# Coverage
# ============================================================================
[tool.coverage.run]
branch = true
omit = [
    "tests/*",
    "venv/*",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
